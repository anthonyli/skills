### 3. `assets/template.html` (HTML 完整母版)
**路径:** `/futuristic-tech-slides/assets/template.html`

```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
    <style>
        @import url('https://cdn.jsdelivr.net/npm/cn-fontsource-misans-bold/font.css');
        @import url('https://cdn.jsdelivr.net/npm/cn-fontsource-misans-regular/font.css');

        :root {
            --canvas: #06080d;
            --stage: #000000;
            --text: #e0e6ed;
            --text-dim: #8a9bb3;
            --accent: #00ffcc;
            --accent-secondary: #bf00ff;
            --surface: rgba(10, 15, 30, 0.8);
            --surface-border: rgba(0, 255, 204, 0.2);
            --font-display: 'Orbitron', 'MiSans', sans-serif;
            --font-body: 'Space Grotesk', 'Noto Sans SC', sans-serif;
        }

        html, body { margin: 0; padding: 0; height: 100%; overflow-x: hidden; background: var(--stage); color: var(--text); font-family: var(--font-body); }
        html { scroll-snap-type: y mandatory; scroll-behavior: smooth; }

        .slide {
            width: 100vw; height: 100vh; height: 100dvh;
            scroll-snap-align: start;
            position: relative; display: flex;
            align-items: center; justify-content: center;
        }

        .slide-inner {
            width: 1280px; height: 720px;
            box-sizing: border-box;
            flex-shrink: 0;
            position: relative;
            transform-origin: center center;
            display: flex; flex-direction: column;
            padding: 60px 80px;
            background: var(--canvas);
            overflow: hidden;
        }

        .grid-bg {
            position: absolute; inset: 0;
            background-image: 
                linear-gradient(var(--surface-border) 1px, transparent 1px),
                linear-gradient(90deg, var(--surface-border) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0; pointer-events: none; opacity: 0.5;
        }

        .vignette {
            position: absolute; inset: 0;
            background: radial-gradient(circle at center, transparent 30%, var(--canvas) 90%);
            z-index: 1; pointer-events: none;
        }

        .slide-content { position: relative; z-index: 10; flex: 1; display: flex; flex-direction: column; }

        h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 700; margin: 0; line-height: 1.2; text-transform: uppercase; }
        p, li { line-height: 1.7; }
        i, em, cite, address, dfn, var { font-style: normal; }

        .accent { color: var(--accent); }
        .accent-sec { color: var(--accent-secondary); }

        /* Glitch Effect */
        @keyframes glitch {
            0%, 100% { clip-path: inset(0 0 98% 0); transform: translateX(0); }
            20% { clip-path: inset(20% 0 60% 0); transform: translateX(-4px); }
            40% { clip-path: inset(60% 0 20% 0); transform: translateX(4px); }
            60% { clip-path: inset(40% 0 40% 0); transform: translateX(-2px); }
            80% { clip-path: inset(80% 0 5% 0); transform: translateX(2px); }
        }
        .glitch-wrapper { position: relative; display: inline-block; }
        .glitch-wrapper::before, .glitch-wrapper::after {
            content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.8;
        }
        .glitch-wrapper::before { color: var(--accent); animation: glitch 2.5s infinite; z-index: -1; }
        .glitch-wrapper::after { color: var(--accent-secondary); animation: glitch 3s infinite; animation-delay: 0.2s; z-index: -2; }

        /* Animations */
        .reveal { opacity: 0; transform: translateY(30px); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal-left { opacity: 0; transform: translateX(-40px); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal-scale { opacity: 0; transform: scale(0.9); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .slide.visible .reveal { opacity: 1; transform: translateY(0); }
        .slide.visible .reveal-left { opacity: 1; transform: translateX(0); }
        .slide.visible .reveal-scale { opacity: 1; transform: scale(1); }
        .d-1 { transition-delay: 0.1s; } .d-2 { transition-delay: 0.2s; } .d-3 { transition-delay: 0.3s; }

        /* UI Elements */
        .card {
            background: var(--surface); border: 1px solid var(--surface-border); padding: 40px;
            backdrop-filter: blur(10px); position: relative;
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
        }
        .card::after { content: ''; position: absolute; bottom: 0; right: 0; width: 20px; height: 20px; background: var(--accent); clip-path: polygon(100% 0, 0 100%, 100% 100%); }

        .tag { display: inline-block; padding: 6px 12px; font-size: 14px; letter-spacing: 2px; background: rgba(0, 255, 204, 0.1); border: 1px solid var(--accent); color: var(--accent); text-transform: uppercase; font-weight: 700; margin-bottom: 24px; }

        .nav-dots { position: fixed; right: 24px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 12px; z-index: 100; }
        .dot { width: 4px; height: 24px; background: rgba(224, 230, 237, 0.2); cursor: pointer; transition: all 0.3s; }
        .dot.active { background: var(--accent); height: 40px; box-shadow: 0 0 10px var(--accent); }

        .keyboard-hint { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); font-size: 13px; color: rgba(224, 230, 237, 0.4); z-index: 100; pointer-events: none; letter-spacing: 1px; text-transform: uppercase; }

        .title-huge { font-size: 80px; } .title-large { font-size: 56px; } .title-medium { font-size: 40px; } .title-small { font-size: 28px; }
        .text-lead { font-size: 24px; color: var(--text-dim); } .text-body { font-size: 20px; }
        
        .list-tech { list-style: none; padding: 0; }
        .list-tech li { position: relative; padding-left: 30px; margin-bottom: 16px; font-size: 20px; }
        .list-tech li::before { content: '>'; position: absolute; left: 0; top: 0; color: var(--accent); font-family: var(--font-display); font-weight: bold; }

        canvas#particles { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    </style>
</head>
<body>
    <nav class="nav-dots"></nav>

    <!-- Slide 1: Cover -->
    <section class="slide">
        <div class="slide-inner flex-center" style="text-align: center; display: flex; align-items: center; justify-content: center;">
            <div class="grid-bg"></div><div class="vignette"></div>
            <canvas id="particles"></canvas>
            <div class="slide-content flex-center" style="z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                <span class="tag reveal" contenteditable="true">Protocol.Initiated</span>
                <h1 class="title-huge reveal d-1 glitch-wrapper" data-text="{{TITLE}}" contenteditable="true">{{TITLE}}</h1>
                <p class="text-lead reveal d-2" contenteditable="true">{{SUBTITLE}}</p>
            </div>
        </div>
    </section>

    <!-- Slide 2: Content Example -->
    <section class="slide">
        <div class="slide-inner">
            <div class="grid-bg"></div><div class="vignette"></div>
            <div class="slide-content">
                <span class="tag reveal" contenteditable="true">Data.Analysis</span>
                <h2 class="title-large reveal d-1" contenteditable="true">核心要点解析</h2>
                <div class="card reveal-scale d-2" style="margin-top: 40px;">
                    <h3 class="title-small" contenteditable="true">01 // 技术指标</h3>
                    <ul class="list-tech">
                        <li contenteditable="true">高性能架构设计</li>
                        <li contenteditable="true">端到端加密协议</li>
                        <li contenteditable="true">毫秒级响应速度</li>
                    </ul>
                </div>
            </div>
        </div>
    </section>

    <div class="keyboard-hint">使用 ↑↓ 方向键翻页</div>

    <script>
        class SlidePresentation {
            constructor() {
                this.slides = document.querySelectorAll('.slide');
                this.dots = document.querySelector('.nav-dots');
                this.current = 0;
                this.setupObserver();
                this.setupKeyboard();
                this.setupDots();
                this.initParticles();
            }
            setupObserver() {
                const obs = new IntersectionObserver(entries => {
                    entries.forEach(e => {
                        if (e.isIntersecting) {
                            e.target.classList.add('visible');
                            this.current = [...this.slides].indexOf(e.target);
                            this.updateDots();
                        }
                    });
                }, { threshold: 0.5 });
                this.slides.forEach(s => obs.observe(s));
            }
            setupKeyboard() {
                window.addEventListener('keydown', e => {
                    if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === ' ') {
                        e.preventDefault(); this.go(this.current + 1);
                    } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                        e.preventDefault(); this.go(this.current - 1);
                    }
                });
            }
            setupDots() {
                this.slides.forEach((s, i) => {
                    const dot = document.createElement('div');
                    dot.className = 'dot';
                    dot.onclick = () => this.go(i);
                    this.dots.appendChild(dot);
                });
                this.updateDots();
            }
            updateDots() {
                this.dots.querySelectorAll('.dot').forEach((d, i) => {
                    d.classList.toggle('active', i === this.current);
                });
            }
            go(i) {
                if (i >= 0 && i < this.slides.length) {
                    this.slides[i].scrollIntoView({ behavior: 'smooth' });
                }
            }
            initParticles() {
                const canvas = document.getElementById('particles');
                if(!canvas) return;
                const ctx = canvas.getContext('2d');
                const resize = () => { canvas.width = canvas.parentElement.offsetWidth; canvas.height = canvas.parentElement.offsetHeight; };
                resize();
                const particles = Array.from({length: 40}, () => ({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5, r: Math.random() * 2 + 1 }));
                const animate = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach(p => {
                        p.x += p.vx; p.y += p.vy;
                        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(0,255,204,0.3)'; ctx.fill();
                    });
                    requestAnimationFrame(animate);
                };
                animate();
            }
        }

        class ScaleController {
            constructor(refWidth = 1280, refHeight = 720) {
                this.refW = refWidth; this.refH = refHeight;
                this.isMobile = /iPhone|iPod|Android.*Mobile|BlackBerry|IEMobile|Opera Mini|webOS/i.test(navigator.userAgent);
                if (this.isMobile) document.documentElement.classList.add('is-mobile');
                this.inners = document.querySelectorAll('.slide-inner');
                this.slides = document.querySelectorAll('.slide');
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }
            resize() {
                if (this.isMobile) {
                    const s = window.innerWidth / this.refW;
                    const scaledH = this.refH * s;
                    this.inners.forEach(inner => { inner.style.transform = `scale(${s})`; });
                    this.slides.forEach(slide => { slide.style.height = `${scaledH}px`; });
                } else {
                    const s = Math.min(window.innerWidth / this.refW, window.innerHeight / this.refH);
                    this.inners.forEach(inner => { inner.style.transform = `scale(${s})`; });
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new SlidePresentation();
            new ScaleController();
            document.querySelectorAll('.card').forEach(el => {
                el.style.transformStyle = 'preserve-3d'; el.style.transition = 'transform 0.1s ease';
                el.addEventListener('mousemove', e => {
                    const rect = el.getBoundingClientRect();
                    const x = (e.clientX - rect.left) / rect.width - 0.5;
                    const y = (e.clientY - rect.top) / rect.height - 0.5;
                    el.style.transform = `perspective(1000px) rotateY(${x * 10}deg) rotateX(${-y * 10}deg)`;
                });
                el.addEventListener('mouseleave', () => { el.style.transform = 'perspective(1000px) rotateY(0) rotateX(0)'; });
            });
        });
    </script>
</body>
</html>
